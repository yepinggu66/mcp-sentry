[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-sentry"
version = "2.0.1"
description = "Zero-Trust Security Gateway, Bidirectional Firewall & Cryptographic Audit Proxy for Model Context Protocol (MCP)"
readme = "README.md"
authors = [{ name = "Ye Yongping", email = "yepinggu66@gmail.com" }]
license = { text = "MIT" }
keywords = [
    "mcp",
    "model-context-protocol",
    "ai-security",
    "firewall",
    "tool-poisoning",
    "rug-pull",
    "circuit-breaker",
    "dlp",
    "audit-ledger",
    "claude",
    "cursor",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.8"
dependencies = []

[project.scripts]
mcp-sentry = "mcp_sentry.cli:main"

[project.urls]
Homepage = "https://github.com/yepinggu66/mcp-sentry"
"Bug Tracker" = "https://github.com/yepinggu66/mcp-sentry/issues"
"Live Interactive Sandbox" = "https://pingguye.cn/stackverdict/agentwall"

[tool.setuptools.packages.find]
include = ["mcp_sentry*"]
